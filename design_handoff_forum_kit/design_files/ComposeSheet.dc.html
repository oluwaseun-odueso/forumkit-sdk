<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>@keyframes fkspin{to{transform:rotate(360deg);}}</style></helmet>
<div style="position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:30px;background:var(--t72, rgba(7,9,15,.7));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);">
  <div role="dialog" aria-label="New post" style="width:100%;max-width:560px;border-radius:22px;overflow:hidden;background:linear-gradient(180deg, var(--t47, rgba(20,26,42,.98)), var(--t43, rgba(10,14,24,.98)));border:1px solid rgba(108,170,245,.22);box-shadow:0 40px 90px -30px var(--t41, rgba(0,0,0,.9));">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid rgba(108,170,245,.12);">
      <span style="font-family:Sora,sans-serif;font-size:16px;font-weight:500;color:var(--t32, #eef3fb);">New post</span>
      <div onClick="{{ onCancel }}" role="button" tabindex="0" aria-label="Close" style="width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t23, #acb7cc);font-size:14px;background:var(--t59, rgba(218,229,247,.06));border:1px solid var(--t65, rgba(218,229,247,.13));">✕</div>
    </div>
    <div style="padding:22px 24px;display:flex;flex-direction:column;gap:14px;max-height:60vh;overflow-y:auto;">
      <div style="position:relative;display:flex;">
        <input value="{{ postTitle }}" onChange="{{ onTitle }}" autofocus placeholder="Title — ask a clear question" aria-label="Post title" style="flex:1;width:100%;background:var(--t58, rgba(218,229,247,.05));border:1px solid rgba(108,170,245,.18);border-radius:12px;padding:13px 128px 13px 15px;outline:none;color:var(--t32, #eef3fb);font-family:Sora,sans-serif;font-size:16px;" />
        <div onClick="{{ onAITitle }}" role="button" tabindex="0" aria-label="Suggest a title with AI" title="Let AI suggest a title from your description" style="position:absolute;right:7px;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:9px;cursor:pointer;font-family:Sora,sans-serif;font-size:12px;font-weight:500;color:var(--t27, #cdb9f5);background:rgba(139,108,240,.16);border:1px solid rgba(139,108,240,.4);">
          <sc-if value="{{ genTitle }}" hint-placeholder-val="{{ false }}"><span style="display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--t76, rgba(205,185,245,.4));border-top-color:var(--t27, #cdb9f5);animation:fkspin .7s linear infinite;"></span> Writing…</sc-if>
          <sc-if value="{{ notGenTitle }}" hint-placeholder-val="{{ true }}"><span style="font-size:13px;line-height:1;">✦</span> Suggest</sc-if>
        </div>
      </div>
      <textarea value="{{ postBody }}" onChange="{{ onBody }}" placeholder="Add context (optional)…" aria-label="Post body" rows="4" style="background:var(--t58, rgba(218,229,247,.05));border:1px solid rgba(108,170,245,.18);border-radius:12px;padding:13px 15px;outline:none;color:var(--t29, #d3dcee);font-family:Sora,sans-serif;font-size:14.5px;line-height:1.55;resize:none;"></textarea>

      <sc-if value="{{ hasAttachments }}" hint-placeholder-val="{{ false }}">
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px;">
          <sc-for list="{{ attachments }}" as="a" hint-placeholder-count="2">
            <div style="position:relative;border-radius:12px;overflow:hidden;background:var(--t58, rgba(218,229,247,.05));border:1px solid rgba(108,170,245,.18);height:96px;display:flex;align-items:center;justify-content:center;">
              <sc-if value="{{ a.isImage }}" hint-placeholder-val="{{ false }}"><img src="{{ a.url }}" alt="{{ a.name }}" style="width:100%;height:100%;object-fit:cover;display:block;" /></sc-if>
              <sc-if value="{{ a.isVideo }}" hint-placeholder-val="{{ false }}"><video src="{{ a.url }}" muted style="width:100%;height:100%;object-fit:cover;display:block;background:var(--t3, #0a0e18);"></video><span style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#16203a;background:rgba(237,243,252,.92);box-shadow:0 4px 10px -3px var(--t36, rgba(0,0,0,.5));">▶</span></sc-if>
              <sc-if value="{{ a.isFile }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;text-align:center;"><span style="font-size:22px;line-height:1;">📄</span><span style="font-family:Sora,sans-serif;font-size:10px;color:var(--t25, #c5cfe1);word-break:break-word;line-height:1.3;max-height:26px;overflow:hidden;">{{ a.name }}</span><span style="font-family:Sora,sans-serif;font-size:9px;color:var(--t15, #757f95);">{{ a.sizeLabel }}</span></div></sc-if>
              <sc-if value="{{ a.pending }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--t42, rgba(10,14,24,.6));font-family:Sora,sans-serif;font-size:10px;color:var(--t23, #acb7cc);">loading…</div></sc-if>
              <div onClick="{{ a.onRemove }}" role="button" tabindex="0" aria-label="Remove {{ a.name }}" title="Remove" style="position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;color:#fff;background:var(--t74, rgba(8,11,18,.78));border:1px solid rgba(255,255,255,.18);">✕</div>
            </div>
          </sc-for>
        </div>
      </sc-if>

      <label style="display:flex;align-items:center;justify-content:center;gap:9px;padding:13px;border-radius:12px;cursor:pointer;border:1px dashed rgba(108,170,245,.34);background:rgba(108,170,245,.05);font-family:Sora,sans-serif;font-size:13px;color:var(--t21, #9fb0cc);" style-hover="background:rgba(108,170,245,.1);">
        <span style="font-size:16px;line-height:1;">🖼</span> Add photos, videos or files
        <input type="file" multiple accept="image/*,video/*,*" onChange="{{ onFiles }}" aria-label="Upload media" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);" />
      </label>

      <div style="position:relative;display:flex;">
        <input value="{{ postTags }}" onChange="{{ onTags }}" placeholder="Tags, comma-separated — e.g. voice, microcopy" aria-label="Tags" style="flex:1;width:100%;background:var(--t58, rgba(218,229,247,.05));border:1px solid rgba(108,170,245,.18);border-radius:12px;padding:11px 128px 11px 15px;outline:none;color:var(--t23, #acb7cc);font-family:Sora,sans-serif;font-size:13.5px;" />
        <div onClick="{{ onAITags }}" role="button" tabindex="0" aria-label="Suggest tags with AI" title="Let AI suggest tags from your post" style="position:absolute;right:7px;top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 13px;border-radius:9px;cursor:pointer;font-family:Sora,sans-serif;font-size:12px;font-weight:500;color:var(--t27, #cdb9f5);background:rgba(139,108,240,.16);border:1px solid rgba(139,108,240,.4);">
          <sc-if value="{{ genTags }}" hint-placeholder-val="{{ false }}"><span style="display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--t76, rgba(205,185,245,.4));border-top-color:var(--t27, #cdb9f5);animation:fkspin .7s linear infinite;"></span> Tagging…</sc-if>
          <sc-if value="{{ notGenTags }}" hint-placeholder-val="{{ true }}"><span style="font-size:13px;line-height:1;">✦</span> Suggest</sc-if>
        </div>
      </div>
    </div>
    <div style="display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:0 24px 22px;">
      <div onClick="{{ onCancel }}" role="button" tabindex="0" style="display:inline-flex;align-items:center;height:42px;padding:0 18px;border-radius:13px;cursor:pointer;color:var(--t23, #acb7cc);font-family:Sora,sans-serif;font-size:14px;">Cancel</div>
      <div onClick="{{ onSubmit }}" role="button" tabindex="0" style="display:inline-flex;align-items:center;height:42px;padding:0 22px;border-radius:13px;cursor:pointer;color:#16203a;font-family:Sora,sans-serif;font-size:14px;font-weight:500;background:radial-gradient(120% 90% at 30% 22%, rgba(255,255,255,.9), rgba(255,255,255,0) 55%), linear-gradient(155deg,#edf3fc,#acbed9 50%,#566884);box-shadow:0 10px 22px -8px var(--t37, rgba(0,0,0,.6)), inset 0 1px 0 rgba(255,255,255,.8);">Post</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1016,&quot;height&quot;:884},&quot;postTitle&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;postTags&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;postBody&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;attachments&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any[]&quot;},&quot;hasAttachments&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;genTitle&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;genTags&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;notGenTitle&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;notGenTags&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onTitle&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e:any)=&gt;void&quot;},&quot;onTags&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e:any)=&gt;void&quot;},&quot;onBody&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e:any)=&gt;void&quot;},&quot;onFiles&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e:any)=&gt;void&quot;},&quot;onAITitle&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;onAITags&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;onSubmit&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;onCancel&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}"></script>
</body>
</html>
