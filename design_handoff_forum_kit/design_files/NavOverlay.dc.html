<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;background:var(--t73, rgba(7,9,15,.78));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);">
  <div style="display:flex;align-items:center;gap:14px;padding:22px 30px;border-bottom:1px solid rgba(108,170,245,.12);">
    <sc-if value="{{ isSearch }}" hint-placeholder-val="{{ true }}">
      <div style="flex:1;display:flex;align-items:center;gap:11px;padding:11px 16px;border-radius:13px;background:var(--t59, rgba(218,229,247,.06));border:1px solid rgba(108,170,245,.24);">
        <span style="color:var(--fk-accent);font-size:16px;line-height:1;">⌕</span>
        <input value="{{ query }}" onChange="{{ onSearchInput }}" autofocus placeholder="Search threads, tags, people…" style="flex:1;background:transparent;border:none;outline:none;color:var(--t30, #e9eff8);font-family:Sora,sans-serif;font-size:16px;" />
      </div>
    </sc-if>
    <sc-if value="{{ isTag }}" hint-placeholder-val="{{ false }}">
      <div style="flex:1;display:flex;align-items:baseline;gap:12px;">
        <span style="font-family:Sora,sans-serif;font-size:22px;font-weight:500;color:var(--t32, #eef3fb);"><span style="color:var(--fk-accent);">#</span>{{ tag }}</span>
        <span style="font-family:Sora,sans-serif;font-size:12.5px;color:var(--t15, #757f95);">{{ resultLabel }}</span>
      </div>
    </sc-if>
    <div onClick="{{ onClose }}" style="width:34px;height:34px;flex:0 0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t23, #acb7cc);font-size:15px;background:var(--t59, rgba(218,229,247,.06));border:1px solid var(--t65, rgba(218,229,247,.13));">✕</div>
  </div>
  <div style="flex:1;overflow-y:auto;padding:22px 30px 28px;">
    <div style="max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:12px;">
      <sc-for list="{{ results }}" as="t" hint-placeholder-count="4">
        <div onClick="{{ t.onClick }}" style="padding:18px 20px;border-radius:16px;cursor:pointer;background:linear-gradient(165deg, var(--t60, rgba(218,229,247,.07)), var(--t55, rgba(218,229,247,.02)));border:1px solid var(--t64, rgba(218,229,247,.12));box-shadow:0 14px 36px -24px var(--t37, rgba(0,0,0,.6));">
          <div style="font-family:Sora,sans-serif;font-size:16.5px;font-weight:500;color:var(--t32, #eef3fb);line-height:1.35;">{{ t.title }}</div>
          <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:11px;"><sc-for list="{{ t.tags }}" as="tg" hint-placeholder-count="2"><span style="font-family:Sora,sans-serif;font-size:10.5px;color:var(--t19, #98a4be);padding:3px 9px;border-radius:20px;background:rgba(108,170,245,.1);border:1px solid rgba(108,170,245,.2);">#{{ tg }}</span></sc-for></div>
          <div style="display:flex;align-items:center;gap:15px;margin-top:13px;font-family:Sora,sans-serif;font-size:11.5px;color:var(--t15, #757f95);"><span style="color:var(--t23, #acb7cc);">▲ {{ t.votes }}</span><span>{{ t.replyLabel }}</span><span>{{ t.author }} · {{ t.time }}</span></div>
        </div>
      </sc-for>
      <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
        <div style="text-align:center;font-family:Sora,sans-serif;font-size:14px;color:var(--t14, #6b7488);padding:46px 0;">No threads here yet.</div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1016,&quot;height&quot;:884},&quot;isSearch&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;isTag&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;tag&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;query&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;results&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any[]&quot;},&quot;resultLabel&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;empty&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onSearchInput&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e:any)=&gt;void&quot;}}"></script>
</body>
</html>
