name: Publish backend image

on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/oluwaseun-odueso/forumkit-api:${{ github.ref_name }}
            ghcr.io/oluwaseun-odueso/forumkit-api:latest

  deploy:
    name: Deploy to EC2
    needs: publish
    # A pre-release tag (anything with a '-', e.g. v0.0.1-test) never
    # auto-deploys. DEPLOY_ENABLED is the kill switch for the whole job -
    # unset or false, deploys stay fully manual.
    if: ${{ !contains(github.ref_name, '-') && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # No `environment:` here - that would change the OIDC `sub` claim the
    # deploy role's trust policy is pinned to (repo:.../ref:refs/tags/v*).
    permissions:
      id-token: write   # required for the AWS OIDC role assumption below
      contents: read
    concurrency:
      # Never run two deploys at once, and never cancel one mid-flight -
      # an interrupted deploy.sh can leave .env's FORUMKIT_TAG and the
      # running container disagreeing about which version is live.
      group: forumkit-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history to check the tag is on main, below

      - name: Refuse to deploy a tag that was never merged to main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not an ancestor of main - refusing to deploy it."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Send deploy/ to the instance and run deploy.sh
        id: ssm
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Only these three files - never the whole deploy/ directory
          # (which also has Dockerfile and docker-compose.dev.yml, neither
          # needed on the host), and never .env/forumkit.env, which live
          # only on the host and aren't in this repo at all.
          TARBALL_B64="$(tar -C deploy -czf - docker-compose.prod.yml Caddyfile deploy.sh | base64 -w0)"

          # Runs under the host's plain `sh` (dash on Ubuntu, which doesn't
          # support `pipefail`) - `set -eu` only here. deploy.sh itself runs
          # under `bash` (invoked explicitly below) and keeps `-o pipefail`.
          jq -n \
            --arg instance_id "$INSTANCE_ID" \
            --arg tag "$TAG" \
            --arg tarball "$TARBALL_B64" \
            '{
              DocumentName: "AWS-RunShellScript",
              InstanceIds: [$instance_id],
              Comment: ("forumkit deploy " + $tag),
              Parameters: {
                commands: [
                  "set -eu",
                  "mkdir -p /opt/forumkit",
                  ("printf %s " + ($tarball|@sh) + " | base64 -d | tar -xzf - -C /opt/forumkit"),
                  ("cd /opt/forumkit && bash deploy.sh " + ($tag|@sh))
                ],
                executionTimeout: ["900"]
              }
            }' > ssm-params.json

          COMMAND_ID="$(aws ssm send-command --cli-input-json file://ssm-params.json \
            --query 'Command.CommandId' --output text)"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy.sh and print its output
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
        run: |
          set -euo pipefail

          # `aws ssm wait command-executed` gives up after ~100s, which is
          # shorter than a cold first deploy (pull, migrations, up to 180s
          # of deploy.sh's own health wait) can take - poll by hand instead,
          # for up to ~12 minutes (the executionTimeout set above is 900s).
          MAX_WAIT_SECONDS=720
          POLL_INTERVAL_SECONDS=10
          elapsed=0
          status="Pending"
          invocation=""

          while [ "$elapsed" -lt "$MAX_WAIT_SECONDS" ]; do
            if invocation="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" 2>&1)"; then
              status="$(printf '%s' "$invocation" | jq -r '.Status' 2>/dev/null || echo Unparseable)"
            elif printf '%s' "$invocation" | grep -q InvocationDoesNotExist; then
              # Only the first seconds after send-command, before SSM has
              # registered the invocation yet - genuinely still pending.
              status="Pending"
            else
              # Any other failure (AccessDenied from a mis-scoped OIDC role,
              # expired credentials, wrong instance id, ...) is real and
              # must fail loudly now, not loop silently for 12 minutes and
              # report nothing but "status: Pending" at the end.
              echo "::error::aws ssm get-command-invocation failed:"
              printf '%s\n' "$invocation" >&2
              exit 1
            fi
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep "$POLL_INTERVAL_SECONDS"
            elapsed=$((elapsed + POLL_INTERVAL_SECONDS))
          done

          echo "--- deploy.sh stdout ---"
          printf '%s' "$invocation" | jq -r '.StandardOutputContent // ""' 2>/dev/null || true
          echo "--- deploy.sh stderr ---"
          printf '%s' "$invocation" | jq -r '.StandardErrorContent // ""' >&2 2>/dev/null || true
          echo "Final SSM command status: $status"

          if [ "$status" != "Success" ]; then
            echo "::error::Deploy failed or timed out waiting for it (status: $status) - see output above"
            # Stdout/stderr above come from jq parsing $invocation - if that
            # parse failed, or the loop exhausted its 12 minutes without
            # ever reaching a terminal status, those would print nothing
            # useful. Dump the raw response too so the cause is visible.
            if [ "$status" = "Unparseable" ] || [ "$status" = "Pending" ]; then
              echo "Raw get-command-invocation response:" >&2
              printf '%s\n' "$invocation" >&2
            fi
            exit 1
          fi
