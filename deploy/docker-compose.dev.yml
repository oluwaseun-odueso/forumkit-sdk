services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "3000:3000"
    # Every value below falls back to a working local default so `docker compose up`
    # still works with no .env at all, but reads from the project-root .env first
    # (docker compose loads .env from the directory you invoke it from) — so
    # self-hosting with real secrets/keys via .env actually takes effect here,
    # rather than being silently ignored in favour of these dev defaults.
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://forumkit:forumkit@db:5432/forumkit}
      DATABASE_POOL_URL: ${DATABASE_POOL_URL:-postgresql://forumkit:forumkit@db:5432/forumkit}
      FORUM_SECRET_KEY: ${FORUM_SECRET_KEY:-dev-secret-change-in-production}
      AI_PROVIDER: ${AI_PROVIDER:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_ASK_MODEL: ${AI_ASK_MODEL:-}
      MODERATION_PROVIDER: ${MODERATION_PROVIDER:-local}
      PERSPECTIVE_API_KEY: ${PERSPECTIVE_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-http://minio:9000}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-forumkit-dev}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-forumkit}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-forumkit-dev}
      STORAGE_MAX_FILE_SIZE_BYTES: ${STORAGE_MAX_FILE_SIZE_BYTES:-26214400}
      STORAGE_ALLOWED_MIME_TYPES: ${STORAGE_ALLOWED_MIME_TYPES:-image/png,image/jpeg,image/gif,image/webp,video/mp4,video/webm}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      NODE_ENV: ${NODE_ENV:-development}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-15}
      MAX_POST_LENGTH: ${MAX_POST_LENGTH:-10000}
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ../packages/api/src:/app/packages/api/src   # hot reload in dev

  # Storage is required (no local-disk fallback) — MinIO stands in as the
  # self-hosted S3-compatible bucket for local dev. Point STORAGE_S3_* at a
  # real provider (AWS S3, R2, B2, Supabase Storage) for anything beyond dev.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: forumkit
      MINIO_ROOT_PASSWORD: forumkit-dev
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the forumkit-dev bucket, since MinIO doesn't auto-create
  # one. Exits after running; api waits on it via service_completed_successfully.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 forumkit forumkit-dev &&
      mc mb -p local/forumkit-dev
      "

  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: forumkit
      POSTGRES_USER: forumkit
      POSTGRES_PASSWORD: forumkit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forumkit -d forumkit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
